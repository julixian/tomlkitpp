[workspace]
members = ["tomlkitpp", "tools/toml-test-adapter"]

[workspace.package]
version = "1.0.1"
standard = "c++23"
license = "Apache-2.0"
mcpp = ">=2026.10.10.1"

[workspace.toolchain]
windows = "llvm@23.1.3"

[workspace.build]
cxx_runtime = "host-coupled"
cxxflags = [
  "-finput-charset=UTF-8",
  "-fexec-charset=UTF-8"
]

[workspace.target.windows.build]
defines = [
  "UNICODE",
  "_UNICODE",
  "WIN32_LEAN_AND_MEAN",
  "NOMINMAX",
  "_CRT_SECURE_NO_WARNINGS"
]

[workspace.target.aarch64-macos]
# LLVM 的 libc++ 头文件需要配套运行库，不能链接系统较旧的 libc++。
cxx_runtime = "self-contained"

[workspace.profile.release]
opt = 3
debug = true
lto = true

[workspace.profile.fast-release]
opt = 0
debug = true
lto = false
